services:
  agent-questions:
    build: .
    restart: unless-stopped
    environment:
      # Noms Host acceptés en plus de 127.0.0.1 et localhost (ici : le nom du service Docker)
      AQ_ALLOWED_HOSTS: agent-questions
      AQ_PUBLIC_URL: http://127.0.0.1:4317
      # Origines autorisées à appeler /mcp depuis le navigateur (interface de llama-server)
      AQ_ALLOWED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
    ports:
      - "127.0.0.1:4317:4317"
    volumes:
      - aq-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4317/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    environment:
      LLAMA_CACHE: /models        # le modèle téléchargé survit aux recréations du conteneur
    command:
      - "-hf"
      - "NobodyWho/Mistral_Ministral-3-8B-Instruct-GGUF:Q4_K_M"
      - "--jinja"                 # indispensable pour l'appel d'outils
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "8192"
      - "-t"
      - "8"
      - "--webui-mcp-proxy"     # à activer seulement si le navigateur est bloqué par CORS
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - llama-models:/models

volumes:
  aq-data:
  llama-models:
