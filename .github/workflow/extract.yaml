name: Extract archive
on:
  push:
    branches: [main]
    paths: ['agent-questions.zip']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract archive
        id: extract
        run: |
          if [ ! -f agent-questions.zip ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          mkdir /tmp/extract
          unzip -q agent-questions.zip -d /tmp/extract
          src=/tmp/extract
          # le zip contient un dossier racine agent-questions/ : on prend son contenu
          if [ "$(ls -A /tmp/extract | wc -l)" -eq 1 ] && [ -d "/tmp/extract/$(ls /tmp/extract)" ]; then
            src="/tmp/extract/$(ls /tmp/extract)"
          fi
          cp -a "$src"/. .
          rm agent-questions.zip

      - name: Commit and push
        if: steps.extract.outputs.found == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Squelette : serveur MCP Streamable HTTP, SQLite, UI Angular" || echo "Rien à committer"
          git push origin HEAD:main
